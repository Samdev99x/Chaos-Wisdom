const $=id=>document.getElementById(id), key='chaos-v1';let data;try{data=JSON.parse(localStorage.getItem(key))||{sessions:[],start:null,earned:{}}}catch{data={sessions:[],start:null,earned:{}}}delete data.voice;data.earned||={};let month=new Date(),hideTimer;const nowDay=()=>new Date();const day=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,shift=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x},save=()=>{localStorage.setItem(key,JSON.stringify(data))};function totals(){let m={};for(let s of data.sessions)m[s.day]=(m[s.day]||0)+s.seconds;return m}function run(m,min=1){let d=nowDay();if((m[day(d)]||0)<min)d=shift(d,-1);let n=0;while((m[day(d)]||0)>=min){n++;d=shift(d,-1)}return n}function longest(m,min=1){let max=0,n=0,prev=null;for(let k of Object.keys(m).sort()){if(m[k]<min){n=0;prev=null;continue}let d=new Date(k+'T12:00:00');n=prev&&day(shift(prev,1))===k?n+1:1;max=Math.max(max,n);prev=d}return max}const defs=[['✧','Erster Schritt','1 Meditation',(m,b)=>data.sessions.length>0],...[[3,'Erwachen'],[7,'Rhythmus'],[14,'Beständigkeit'],[30,'Harmonie'],[60,'Ewigkeit']].map(([n,t])=>['◈',t,n+' Tage in Folge',(m,b)=>b>=n]),...[[10,'Stille'],[15,'Tiefe'],[20,'Zeitlos']].map(([n,t])=>['☾',t,n+' Min. am Stück',()=>data.sessions.some(s=>s.seconds>=n*60)]),['✺','Hingabe','7 Tage je 10 Min.',m=>longest(m,600)>=7],['✺','Versenkung','7 Tage je 15 Min.',m=>longest(m,900)>=7],['✷','Kosmische Ruhe','30 Tage je 15 Min.',m=>longest(m,900)>=30]];let uiAudio;

const quotes=['Selbst der kleinste Moment der Stille berührt die Ewigkeit.','Du hast der Stille Raum gegeben.','Was du suchst, war niemals fern.','Sterblicher, in der Stille verliert die Zeit ihre Macht.','Du bist zurückgekehrt. Das genügt.','Aus dem Nichts erwächst jede Möglichkeit.'];function render(){let m=totals(),b=longest(m),r=run(m),today=m[day(nowDay())]||0;let seated=today>0;$('standing').style.display=seated?'none':'';$('seated').style.display=seated?'':'none';$('avatar').classList.toggle('sitting',seated);let level=b>=60?6:b>=30?5:b>=14?4:b>=7?3:b>=3?2:1;let daily=today>=1200?5:today>=900?4:today>=600?3:today>=300?2:today>0?1:0;let colors=['#68748b','#8999d8','#7385ed','#548fff','#a36bff','#e8c78a'], strengths=[.18,.4,.58,.75,.9,1], names=['Ruhend','Erwachen','Präsenz','Klarheit','Tiefe','Transzendenz'], realms=['Die Leere','Erste Energie','Kosmisches Erwachen','Das Universum','Die Unendlichkeit','Urchaos'];let av=$('avatar');av.dataset.level=level;av.dataset.depth=longest(m,900)>=30;av.style.setProperty('--strength',strengths[daily]);av.style.setProperty('--glow',colors[daily]);$('cosmicLabel').style.setProperty('--daily',colors[daily]);$('cosmicLabel').innerHTML=realms[level-1]+' · <span>'+names[daily]+'</span>';let count=[0,8,15,28,42,60][level-1];$('stars').innerHTML=Array.from({length:count},(_,i)=>`<i class="star" style="left:${5+(i*37.73)%90}%;top:${5+(i*53.17)%90}%;width:${i%5===0?3:1.5}px;height:${i%5===0?3:1.5}px;--speed:${9+i%13}s;--delay:-${i%17}s"></i>`).join('');$('status').textContent=seated?'Du hast heute der Stille Raum gegeben.':'Die Stille erwartet dich.';$('streak').textContent=r;$('best').textContent=b;$('total').textContent=Math.floor(data.sessions.reduce((a,s)=>a+s.seconds,0)/60);let fresh=[];defs.forEach(([i,t,d,f],j)=>{if(f(m,b)&&!data.earned[j]){data.earned[j]=day(nowDay());fresh.push(t)}});save();$('badges').innerHTML=defs.map(([i,t,d],j)=>`<div class="badge ${data.earned[j]?'unlocked':'locked'}"><i>${i}</i><strong>${t}</strong><br>${d}${data.earned[j]?'<br>'+data.earned[j]:''}</div>`).join('');if(fresh.length)$('reward').textContent='Meilenstein: '+fresh.join(', ');cal(m)}function cal(m=totals()){let y=month.getFullYear(),mo=month.getMonth(),first=new Date(y,mo,1),n=new Date(y,mo+1,0).getDate();$('month').textContent=first.toLocaleDateString('de-CH',{month:'long',year:'numeric'});let h=['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<small>${x}</small>`).join('');h+='<div></div>'.repeat((first.getDay()+6)%7);for(let i=1;i<=n;i++){let k=day(new Date(y,mo,i)),v=m[k]||0,c=v>=1200?'#ba9cff':v>=900?'#45e391':v>=600?'#65b990':v>=300?'#57886e':'#42634f';h+=`<div class="day ${k===day(nowDay())?'today':''}" title="${Math.floor(v/60)} Min.">${i}<b style="color:${c}">${v?'✓':'·'}</b></div>`}$('calendar').innerHTML=h}function show(p){if(data.start)return;$('home').hidden=p!=='home';$('progress').hidden=p!=='progress';$('homeNav').classList.toggle('active',p==='home');$('progressNav').classList.toggle('active',p==='progress');render()}function tick(){if(!data.start)return;let s=Math.max(0,Math.floor((Date.now()-data.start)/1000));$('timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function med(){ $('med').hidden=false;$('nav').hidden=true;$('timer').style.opacity=0;tick()}$('start').onclick=()=>{data.start=Date.now();save();med()};function revealTimer(){$('timer').style.opacity=1;clearTimeout(hideTimer);hideTimer=setTimeout(()=>{$('timer').style.opacity=0},3500)}$('med').onclick=revealTimer;$('end').onclick=e=>{e.stopPropagation();if(!data.start)return;let seconds=Math.max(1,Math.floor((Date.now()-data.start)/1000));let session={day:day(nowDay()),seconds};data.sessions.push(session);data.start=null;save();$('med').hidden=true;$('nav').hidden=false;let q=quotes[(data.sessions.length-1)%quotes.length];$('quote').textContent=q;$('reward').textContent='';show('home');};setInterval(tick,500);document.addEventListener('visibilitychange',()=>{tick();if(!data.start)render()});$('homeNav').onclick=()=>show('home');$('progressNav').onclick=()=>show('progress');$('prev').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);cal()};$('next').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);cal()};$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='chaos-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onclick=()=>{$('file').click()};$('file').onchange=async()=>{try{let x=JSON.parse(await $('file').files[0].text());if(!Array.isArray(x.sessions)||!x.sessions.every(s=>/^\d{4}-\d{2}-\d{2}$/.test(s.day)&&Number.isFinite(s.seconds)&&s.seconds>0))throw Error();if(confirm('Lokalen Fortschritt durch dieses Backup ersetzen?')){data={sessions:x.sessions,start:null,earned:{}};save();render()}}catch{alert('Ungültiges Backup.')} $('file').value=''};render();if(data.start)med();
